  <!-- card 4 vision -->
  <rect x="30" y="268" width="286" height="160" rx="12" fill="#FFFFFF" stroke="#D5DBE6"/>
  <rect x="30" y="268" width="286" height="8" rx="4" fill="#B8860B"/>
  <text x="173" y="304" text-anchor="middle" font-size="16" font-weight="bold" fill="#26323F" font-family="Segoe UI, Microsoft YaHei, sans-serif">验光 + 配镜</text>
  <text x="173" y="330" text-anchor="middle" font-size="11" fill="#7A8699" font-family="Segoe UI, Microsoft YaHei, sans-serif">Vision (Superior Vision 网)</text>
  <text x="173" y="366" text-anchor="middle" font-size="34" font-weight="bold" fill="#B8860B" font-family="Segoe UI, Microsoft YaHei, sans-serif">$10+$25</text>
