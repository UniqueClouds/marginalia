  <text x="470" y="182" text-anchor="middle" font-size="34" font-weight="bold" fill="#2E7D32" font-family="Segoe UI, Microsoft YaHei, sans-serif">$0</text>
  <text x="470" y="216" text-anchor="middle" font-size="12.5" fill="#4A5568" font-family="Segoe UI, Microsoft YaHei, sans-serif">官方：100% 覆盖 · 无 copay · 免转诊</text>

  <!-- card 3 dental -->
  <rect x="624" y="84" width="286" height="160" rx="12" fill="#FFFFFF" stroke="#D5DBE6"/>
  <rect x="624" y="84" width="286" height="8" rx="4" fill="#2E7D32"/>
  <text x="767" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#26323F" font-family="Segoe UI, Microsoft YaHei, sans-serif">洗牙/检查/涂氟</text>
  <text x="767" y="146" text-anchor="middle" font-size="11" fill="#7A8699" font-family="Segoe UI, Microsoft YaHei, sans-serif">Dental preventive care</text>
  <text x="767" y="182" text-anchor="middle" font-size="34" font-weight="bold" fill="#2E7D32" font-family="Segoe UI, Microsoft YaHei, sans-serif">$0</text>
