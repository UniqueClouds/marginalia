<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620">
  <rect x="0" y="0" width="940" height="620" fill="#F7F8FB"/>
  <rect x="0" y="0" width="940" height="56" fill="#002F6C"/>
  <text x="470" y="36" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">SHC 热门服务实付价 · What you actually pay at the Student Health Center</text>

  <!-- card 1 office visit -->
  <rect x="30" y="84" width="286" height="160" rx="12" fill="#FFFFFF" stroke="#D5DBE6"/>
  <rect x="30" y="84" width="286" height="8" rx="4" fill="#002F6C"/>
  <text x="173" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#26323F" font-family="Segoe UI, Microsoft YaHei, sans-serif">门诊（PCP/专科）</text>
  <text x="173" y="146" text-anchor="middle" font-size="11" fill="#7A8699" font-family="Segoe UI, Microsoft YaHei, sans-serif">Office visit</text>
  <text x="173" y="182" text-anchor="middle" font-size="34" font-weight="bold" fill="#002F6C" font-family="Segoe UI, Microsoft YaHei, sans-serif">$5</text>
  <text x="173" y="216" text-anchor="middle" font-size="12.5" fill="#4A5568" font-family="Segoe UI, Microsoft YaHei, sans-serif">SHC/网内每次 · 免赔额豁免</text>

  <!-- card 2 vaccines -->
  <rect x="327" y="84" width="286" height="160" rx="12" fill="#FFFFFF" stroke="#D5DBE6"/>
  <rect x="327" y="84" width="286" height="8" rx="4" fill="#2E7D32"/>
  <text x="470" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#26323F" font-family="Segoe UI, Microsoft YaHei, sans-serif">疫苗 &amp; TB 检测</text>
