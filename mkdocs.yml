      - 003 · NOTUGLY-S: entries/003-notugly-s.en.md
      - 004 · Storytelling quantified: entries/004-storytelling-quantified.en.md
      - 005 · Discipline voices: entries/005-discipline-style-voices.en.md
      - 007 · Nuance rises and falls: entries/007-nuance-rises-and-falls.en.md
      - 008 · LLM Scaling note: entries/008-llm-scaling-book.en.md
      - 009 · Borrowed boundary, not fractal: entries/009-homology-without-fractal.en.md
      - 010 · Enterprise organisational inertia: entries/010-organizational-inertia.en.md
